name: Reqio agent

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reqio-agent
  cancel-in-progress: false

jobs:
  open-pull-requests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: reqio-app/feedback-to-pr@feat/review-feedback-mode
        with:
          project-id: cms6917zf00081msb8njz06j7
          base-url: https://reqio.app
          branch-prefix: "reqio/feature-"
          agent-command: "printenv OPENAI_API_KEY | npx -y @openai/codex@latest login --with-api-key && npx -y @openai/codex@latest exec --dangerously-bypass-approvals-and-sandbox --ephemeral --color never"
          auto-approve: "false"
          max-prs-per-run: "1"
          test-command: ""
          allow-test-edits: "false"
        env:
          REQIO_API_KEY: ${{ secrets.REQIO_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
