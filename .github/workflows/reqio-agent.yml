name: Reqio agent

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "verify checks your setup without spending anything. poll does the real work."
        required: true
        default: verify
        type: choice
        options:
          - verify
          - poll

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'verify'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: reqio-app/feedback-to-pr@v2
        with:
          mode: verify
          project-id: cms6917zf00081msb8njz06j7
          base-url: https://reqio.app
        env:
          REQIO_API_KEY: ${{ secrets.REQIO_API_KEY }}

  open-pull-requests:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'poll')
    runs-on: ubuntu-latest
    concurrency:
      group: reqio-agent
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: reqio-app/feedback-to-pr@v2
        with:
          project-id: cms6917zf00081msb8njz06j7
          base-url: https://reqio.app
          branch-prefix: "reqio/feature-"
          # agent-command is deliberately absent, which selects the default
          # (Claude Code headless). An explicitly empty string is NOT the same
          # thing and fails the run on purpose.
          # Matches the action's own default, which is the point of this
          # sandbox: it exercises what a customer actually gets, not a
          # configuration only this repository runs. So a bug is picked up only
          # once someone moves it to In progress. To test the overnight path,
          # flip this to "true" for that run and put it back after.
          auto-approve: "false"
          max-prs-per-run: "1"
          test-command: ""
          allow-test-edits: "false"
        env:
          REQIO_API_KEY: ${{ secrets.REQIO_API_KEY }}
          # Only the key the selected agent needs. The action passes an
          # allowlisted environment through to the agent, so a second provider
          # key declared here would reach it for no reason.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
