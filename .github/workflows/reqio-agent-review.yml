name: Reqio agent (review)

# Three places a human can leave feedback on a pull request, three different
# GitHub events. Subscribing to fewer than all three means the agent silently
# ignores feedback depending on which box the reviewer happened to type into.
#
#   Conversation tab, bottom box   -> issue_comment
#   Files changed, single comment  -> pull_request_review_comment
#   Files changed, Submit review   -> pull_request_review
#
# issue_comment was removed from this file on 2026-08-03 and is restored here
# now that feedback-to-pr@v2.1.0 refuses fork pull requests server-side. GitHub
# does not apply its fork permission downgrade to that event and its payload
# carries no head.repo, so the fork check the other two triggers make below is
# inexpressible for it. The protection is runReview's gate in main.mjs, which
# runs whatever this file says. Do not pin this job back to @v1 or @v2.0.0:
# neither has that gate.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reqio-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  address-review:
    # Everything decidable from the payload is decided here, because a job that
    # starts only to exit still bills a whole minute. author_association is the
    # one that matters on a public repo: without it a stranger's comment spends
    # the repo owner's model key inside the repo owner's runner.
    #
    # The keyword test pads the body and matches ' /reqio ' as a word rather
    # than a bare substring, which used to fire on any comment merely
    # mentioning the integration ("see https://reqio.app"). It misses '/reqio'
    # alone on its own line, an accepted gap: this only decides whether the job
    # starts, never whether it may act.
    if: >
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.comment.user.type != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(format(' {0} ', github.event.comment.body), ' /reqio ')
      ) || (
        github.event_name == 'pull_request_review_comment' &&
        github.event.pull_request.head.repo.fork == false &&
        github.event.comment.user.type != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(format(' {0} ', github.event.comment.body), ' /reqio ')
      ) || (
        github.event_name == 'pull_request_review' &&
        github.event.pull_request.head.repo.fork == false &&
        github.event.review.state == 'changes_requested' &&
        github.event.review.user.type != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: reqio-app/feedback-to-pr@v2
        with:
          mode: review
          pr-number: ${{ github.event.issue.number || github.event.pull_request.number }}
          project-id: cms6917zf00081msb8njz06j7
          base-url: https://reqio.app
          branch-prefix: "reqio/feature-"
          agent-command: "printenv OPENAI_API_KEY | npx -y @openai/codex@latest login --with-api-key && npx -y @openai/codex@latest exec --dangerously-bypass-approvals-and-sandbox --ephemeral --color never"
          test-command: ""
          allow-test-edits: "false"
        env:
          REQIO_API_KEY: ${{ secrets.REQIO_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
